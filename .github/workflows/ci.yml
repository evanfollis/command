name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROMPTEVAL_HARNESS_REPO: ${{ github.workspace }}/.command-ci/supervisor
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out reviewed prompt-evaluation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: evanfollis/supervisor
          ref: 8a0c0e329d67f6be2cd248acf028406fb53927b7
          path: .command-ci/supervisor
          sparse-checkout: scripts/lib/prompteval
          sparse-checkout-cone-mode: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: make build
